<section class="sub-page">

  <button class="back-button" type="button" (click)="volver.emit()">
    <ion-icon name="arrow-back-outline"></ion-icon>
    Volver
  </button>

  <div class="cat-header" *ngIf="categoria" [style.--cat-color]="categoria.color">
    <div class="cat-icon">
      <ion-icon [name]="categoria.icono"></ion-icon>
    </div>
    <div class="cat-texto">
      <h2>{{ categoria.nombre }}</h2>
      <p>¿Qué se te antoja hoy?</p>
    </div>
  </div>

  <p *ngIf="cargando" class="estado">Cargando...</p>
  <p *ngIf="error" class="error-message">{{ error }}</p>

  <div class="grid" *ngIf="!cargando">
    <button
      class="sub-card"
      type="button"
      *ngFor="let s of subcategorias"
      [style.--sub-color]="s.color"
      (click)="seleccionar.emit(s)">

      <div class="sub-icon">
        <ion-icon [name]="s.icono"></ion-icon>
      </div>
      <span>{{ s.nombre }}</span>
    </button>
  </div>

</section>
