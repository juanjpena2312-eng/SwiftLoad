<ion-header>
  <ion-toolbar>
    <ion-title>Mis envíos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="envios-content">
  @if (hayUsuario) {
    <app-historial
      [pedidos]="pedidos"
      [cargando]="cargando"
      [error]="error"
      (volver)="irAInicio()">
    </app-historial>
  } @else {
    <section class="sesion-requerida">
      <h1>Inicia sesión para ver tus envíos</h1>
      <p>Al entrar a tu cuenta podrás revisar tus pedidos y su estado.</p>
      <ion-button (click)="iniciarSesion()">Ir a Inicio</ion-button>
    </section>
  }
</ion-content>
